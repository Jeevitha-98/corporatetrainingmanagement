<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stackly Portal - Terminal Overlap 404</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MASTER VIEWPORT CANVAS CONTAINER -->
    <main class="error-canvas-wrapper">
        
        <!-- Hardware accelerated glowing grid matrix background -->
        <div class="error-perspective-grid"></div>
        <div class="error-ambient-vignette"></div>

        <!-- CENTERED REGION: High Visibility Content Core -->
        <div class="error-content-block">
            
            <!-- Giant high-contrast neon textured state number -->
            <div class="error-glitch-badge-frame">
                <span class="error-badge-pretitle">⚠️ ACCESS CELL OVERLAP</span>
                <h1 class="error-code-num">404</h1>
            </div>
            
            <h2 class="error-main-heading">Terminal Route Not Found</h2>
            
            <p class="error-description">
                The requested capability registry endpoint or system metric dashboard section does not exist or has been migrated to an alternative administrative network branch layer.
            </p>

            <!-- Dual Action Button Group Row -->
            <div class="error-action-row">
                <!-- Primary Action Button: Returns operator to exact previous active section via history cache -->
                <button class="btn-error-action primary-sand" id="btn-history-back">
                    <span class="btn-vector-icon">←</span> Go Back
                </button>
                
                <!-- Secondary Wireframe Button: Routes safely back to index.html -->
                <a href="index.html" class="btn-error-action secondary-wire">
                    Return Home <span class="btn-vector-icon">➔</span>
                </a>
            </div>

        </div>
    </main>

  <style>
    /* ========================================================
   STACKLY EXTRA HIGH-CONTRAST 404 CANVASES ENVIRONMENT STYLES
   ======================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

body {
    background-color: #050811;
    overflow: hidden; /* Locks layout boundaries cleanly to eliminate screen edge shifting */
}

.error-canvas-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Strict parameter spacing compliance: 50px Top Padding / 30px Bottom Padding */
    padding: 50px 6% 30px 6%;
    background-color: #050811;
}

/* ========================================================
   CREATIVE ADVANCED METRIC GRADIENT OVERLAY INFRASTRUCTURE
   ======================================================== */
.error-perspective-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(rgba(74, 222, 128, 0.05) 1px, transparent 1px);
    background-size: 24px 24px;
    z-index: 1;
    opacity: 0.8;
}

/* Dark polarizing vignette mask provides extreme text clarity curves */
.error-ambient-vignette {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, transparent 20%, #050811 80%),
                linear-gradient(180deg, #050811 0%, transparent 40%, #050811 100%);
    z-index: 2;
    pointer-events: none;
}

/* ========================================================
   CENTER COMPONENT CONTENT ARCHITECTURE
   ======================================================== */
.error-content-block {
    position: relative;
    z-index: 3;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 640px; /* Constrained visual footprint for sleek centering */
    animation: errorContentEntrance LIFT 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes errorContentEntrance {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
}

.error-glitch-badge-frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 16px;
}

.error-badge-pretitle {
    font-size: 0.8rem;
    font-weight: 700;
    color: #F87171; /* High alert crimson text highlight */
    background-color: rgba(248, 113, 113, 0.06);
    border: 1px solid rgba(248, 113, 113, 0.15);
    padding: 6px 14px;
    border-radius: 20px;
    letter-spacing: 0.12em;
    margin-bottom: 12px;
}

.error-code-num {
    font-size: 8rem; /* Giant high-visibility scaling factor preference */
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1;
    letter-spacing: -0.04em;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
    transition: color 0.3s ease, text-shadow 0.3s ease;
}

.error-main-heading {
    font-size: 2.2rem;
    font-weight: 700;
    color: #FFFFFF;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin-bottom: 16px;
}

.error-description {
    font-size: 1.05rem; /* Medium visibility text scale parameters */
    line-height: 1.6;
    color: #64748B; /* Subdued gray readability copy path lines */
    margin-bottom: 40px;
    font-weight: 400;
}

/* ========================================================
   DUAL ACTION BUTTON DOCK STRIPS CONTROLS
   ======================================================== */
.error-action-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    width: 100%;
}

.btn-error-action {
    padding: 14px 32px;
    font-size: 0.95rem;
    font-weight: 700;
    border-radius: 30px; /* Precise capsule trajectory track geometry button shape values */
    text-decoration: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Primary Sand-Beige Solid Button precisely matching your login/signup palette configs */
.btn-error-action.primary-sand {
    background-color: #E7D4C5; 
    color: #050811;
    border: none;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.btn-error-action.primary-sand:hover {
    background-color: #D6BEAE;
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
}

/* Secondary Wireframe Border Accent Link Line */
.btn-error-action.secondary-wire {
    background-color: transparent;
    color: #FFFFFF;
    border: 1px solid rgba(255, 255, 255, 0.15);
}

.btn-error-action.secondary-wire:hover {
    background-color: rgba(74, 222, 128, 0.04); /* Flashes background tint into brand green on focus */
    border-color: #4ADE80; /* Outlines light up to crisp signature Ancient Green */
    color: #4ADE80;
    transform: translateY(-2px);
    box-shadow: 0 0 15px rgba(74, 222, 128, 0.2);
}

.btn-vector-icon {
    font-size: 1.05rem;
    line-height: 1;
    transition: transform 0.2s ease;
}

.btn-error-action.secondary-wire:hover .btn-vector-icon {
    transform: translateX(4px); /* Interactive visual extension step multiplier */
}

/* ========================================================
   MASTER IMMERSIVE TEXT HOVER GLOW TRANSLATIONS
   ======================================================== */
.error-content-block:hover .error-code-num {
    color: #4ADE80; /* Giant text numbers seamlessly light up to Stackly Green on block focus */
    text-shadow: 0 0 35px rgba(74, 222, 128, 0.35);
}

/* ========================================================
   FLUID RESPONSIVE SYSTEM MEDIA BREAKPOINTS PANELS
   ======================================================== */
@media (max-width: 640px) {
    .error-canvas-wrapper { padding: 40px 4% 24px 4%; }
    .error-code-num { font-size: 5.5rem; }
    .error-main-heading { font-size: 1.65rem; }
    .error-description { font-size: 0.95rem; margin-bottom: 32px; }
    
    /* Collapse the button rows cleanly into single vertical column streams on mobile screen widths */
    .error-action-row { flex-direction: column; gap: 12px; }
    .btn-error-action { width: 100%; justify-content: center; border-radius: 12px; }
}

  </style>

  <script>
    /**
 * STACKLY 404 GATE CONTROLLER
 * Asynchronous Navigation History Router Engine
 */

document.addEventListener("DOMContentLoaded", () => {
    
    // ========================================================
    // INTELLIGENT BACKWARD ROUTING LIFE-CYCLE CONTROLLER
    // ========================================================
    const historyBackButton = document.getElementById("btn-history-back");

    if (historyBackButton) {
        historyBackButton.addEventListener("click", (event) => {
            event.preventDefault();

            // STEP A: Verify browser length logs matrix threshold
            if (document.referrer !== "" && window.history.length > 1) {
                // Return operator seamlessly to previous page frame and open active section directly
                window.history.back();
            } else {
                // If history thread index is completely blank, fallback route safely to dashboard index
                window.location.href = "login.html";
            }
        });
    }
});

  </script>
</body>
</html>
