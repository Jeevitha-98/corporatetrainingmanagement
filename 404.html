<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Route Not Found | Stackly Training Portal</title>
<style>
:root {
    --bg: #050811;
    --card-glow: rgba(74, 222, 128, 0.04);
    --white: #FFFFFF;
    --muted: #64748B;
    --muted-dim: #475569;
    --danger: #F87171;
    --danger-bg: rgba(248, 113, 113, 0.08);
    --danger-border: rgba(248, 113, 113, 0.25);
    --accent-green: #4ADE80;
    --cream: #F4EFE6;
    --cream-text: #050811;
    --font-stack: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font-stack);
}

html, body {
    height: 100%;
}

body {
    background-color: var(--bg);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    position: relative;
}

/* Ambient backdrop glow, consistent with the portal's login screen */
.route-glow-backdrop {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 520px;
    background: radial-gradient(circle, var(--card-glow) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
}

.route-error-stage {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 680px;
    padding: clamp(24px, 6vw, 60px) clamp(20px, 6vw, 40px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Status badge */
.route-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background-color: var(--danger-bg);
    border: 1px solid var(--danger-border);
    color: var(--danger);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 30px;
    margin-bottom: clamp(28px, 6vw, 48px);
}

.route-status-badge svg {
    width: 13px;
    height: 13px;
    fill: var(--danger);
    flex-shrink: 0;
}

/* Big 404 numeral */
.route-numeral {
    font-size: clamp(4.5rem, 16vw, 8rem);
    font-weight: 800;
    line-height: 1;
    color: var(--white);
    letter-spacing: -0.02em;
    margin-bottom: clamp(16px, 3vw, 24px);
}

/* Headline */
.route-headline {
    font-size: clamp(1.6rem, 5vw, 2.3rem);
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.01em;
    margin-bottom: clamp(14px, 3vw, 20px);
}

/* Description */
.route-description {
    font-size: 0.98rem;
    line-height: 1.65;
    color: var(--muted);
    max-width: 46ch;
    margin-bottom: clamp(28px, 6vw, 44px);
}

/* Action buttons */
.route-action-group {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
}

.btn-route {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 28px;
    border-radius: 30px;
    font-size: 0.92rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.25s ease, background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.btn-route-back {
    background-color: var(--cream);
    color: var(--cream-text);
    border: none;
}

.btn-route-back:hover,
.btn-route-back:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(244, 239, 230, 0.12);
}

.btn-route-home {
    background-color: transparent;
    color: var(--white);
    border: 1px solid rgba(255, 255, 255, 0.14);
}

.btn-route-home:hover,
.btn-route-home:focus-visible {
    border-color: rgba(74, 222, 128, 0.35);
    background-color: rgba(74, 222, 128, 0.04);
    transform: translateY(-2px);
}

.btn-route:focus-visible {
    outline: 2px solid var(--accent-green);
    outline-offset: 3px;
}

/* ========================================================
   RESPONSIVE BREAKPOINTS
   ======================================================== */
@media (max-width: 640px) {
    .route-error-stage { padding: 24px 20px; }
    .route-action-group { flex-direction: column; width: 100%; max-width: 320px; }
    .btn-route { width: 100%; padding: 14px 20px; }
    .route-status-badge { font-size: 0.7rem; padding: 7px 14px; }
}

@media (max-width: 360px) {
    .route-numeral { font-size: 3.6rem; }
    .route-headline { font-size: 1.35rem; }
    .route-description { font-size: 0.88rem; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="route-glow-backdrop" aria-hidden="true"></div>

<main class="route-error-stage">
    <span class="route-status-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        Curriculum Access Overlap
    </span>

    <h1 class="route-numeral">404</h1>
    <h2 class="route-headline">Terminal Route Not Found</h2>
    <p class="route-description">The requested course module or trainee dashboard route could not be resolved. It may have been retired from the active curriculum or migrated to a different training branch.</p>

    <div class="route-action-group">
        <button type="button" id="route-trigger-go-back" class="btn-route btn-route-back">
            <span aria-hidden="true">←</span> Go Back
        </button>
        <a href="index.html" class="btn-route btn-route-home">
            Return Home <span aria-hidden="true">→</span>
        </a>
    </div>
</main>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const goBackTrigger = document.getElementById("route-trigger-go-back");

    if (goBackTrigger) {
        goBackTrigger.addEventListener("click", () => {
            // Prefer real browser history navigation first: it restores the
            // previous page's scroll position / section (via bfcache) instead
            // of a fresh reload that always lands at the top of the page.
            if (window.history.length > 1) {
                window.history.back();
            } else if (document.referrer && document.referrer !== "") {
                window.location.href = document.referrer;
            } else {
                window.location.href = "index.html";
            }
        });
    }
});


(function () {
    var STORAGE_PREFIX = "scrollPos::";
    var key = STORAGE_PREFIX + window.location.pathname;
    var saveTimer = null;

    function saveScrollPosition() {
        try {
            sessionStorage.setItem(key, String(window.scrollY));
        } catch (e) {
            /* sessionStorage unavailable — fail silently */
        }
    }

    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(saveScrollPosition, 120);
    }

    function restoreScrollPosition() {
        var saved;
        try {
            saved = sessionStorage.getItem(key);
        } catch (e) {
            return;
        }
        if (saved === null) return;

        var targetY = parseInt(saved, 10);
        if (isNaN(targetY)) return;

        // Wait a tick so layout/images have settled before scrolling.
        requestAnimationFrame(function () {
            window.scrollTo({ top: targetY, behavior: "auto" });
        });
    }

    window.addEventListener("scroll", scheduleSave, { passive: true });
    window.addEventListener("pagehide", saveScrollPosition);
    window.addEventListener("beforeunload", saveScrollPosition);
    document.addEventListener("DOMContentLoaded", restoreScrollPosition);
})();
</script>
</body>
</html>
